<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Password Generator</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style type="text/tailwindcss">
            @theme {
                --font-dancing: "Dancing Script", cursive;
                --font-garamond: "EB Garamond", serif;
            }
        </style>
    </head>
    <body class=" font-garamond bg-[#FFE6EE] flex items-center justify-center min-h-screen text-[#F06A8C]">
        <div class="bg-[#FFDBE9] p-20 rounded-3xl shadow-2xl">
        <h1 class=" font-dancing text-3xl font-bold text-center mb-10 mt-1">Password Generator</h1>
        <div class="flex items-center gap-3">
        <label for="pwd" class="font-medium">Password:</label><br>
        <input type="text" id="pwd" name="pwd" class="border border-black-300 rounded-lg px-3 py-2 w-64 text-[#FF91AF]"><br><br>
        </div>
        <div class="flex justify-center p-2 gap-5">
        <button id="generate" class="bg-[#FFD1DC] px-4 py-2 rounded-lg hover:bg-[#FFB6C1] text-[#FF91AF]">Generate Password</button>
        <button id="copy" class="bg-[#FFD1DC] px-4 py-2 rounded-lg hover:bg-[#FFB6C1] text-[#FF91AF]">Copy</button>
        </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
